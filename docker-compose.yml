services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-screeneasy}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      TEST_LINK: ${TEST_LINK:-}
      TEST_PASSING_SCORE: ${TEST_PASSING_SCORE:-70}
      LLM_TPM_LIMIT: ${LLM_TPM_LIMIT:-8000}
      LLM_BATCH_SIZE: ${LLM_BATCH_SIZE:-1}
      LLM_BATCH_WAIT_SECONDS: ${LLM_BATCH_WAIT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_BASE_WAIT: ${LLM_RETRY_BASE_WAIT:-5}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/google-calendar/callback}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
    volumes:
      - uploads:/app/uploads
      - resumes:/app/resumes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - screeneasy-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-screeneasy}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - screeneasy-network

volumes:
  postgres-data:
  uploads:
  resumes:

networks:
  screeneasy-network:
    driver: bridge
